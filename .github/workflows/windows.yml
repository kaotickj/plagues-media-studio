name: Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt Pillow
      - name: Generate Windows application icon
        run: python -c "from PIL import Image; Image.open('assets/plagues-media-studio.png').save('assets/plagues-media-studio.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128)])"
      - run: python -m py_compile desktop/main.py desktop/theme.py
      - run: pyinstaller --noconfirm --windowed --name PlaguesMediaStudio --icon assets/plagues-media-studio.ico --add-data "assets;assets" desktop/main.py
      - uses: Minionguyjpro/Inno-Setup-Action@v1.2.6
        with:
          path: packaging/windows.iss
      - uses: actions/upload-artifact@v4
        with:
          name: PlaguesMediaStudio-Windows-Installer
          path: dist/PlaguesMediaStudio-Windows-Setup.exe
          if-no-files-found: error
